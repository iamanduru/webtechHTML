<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>User Login | Ngao</title>

    <link rel="stylesheet" href="css/style.css">
</head>


<body>

    <header class="site-header">

        <a href="index.html" class="brand">
            Ngao
        </a>


        <nav class="main-nav">

            <a href="index.html">
                Home
            </a>

            <a href="about.html">
                About
            </a>

            <a href="report.html">
                Report Scam
            </a>

            <a href="contact.html">
                Contact
            </a>

            <a href="user-login.html" class="active">
                User Portal
            </a>

            <a href="analyst-login.html">
                Analyst Portal
            </a>

        </nav>

    </header>


    <main class="auth-page">

        <section class="form-container reveal">

            <p class="eyebrow">
                USER ACCESS
            </p>

            <h1>
                Welcome back
            </h1>

            <p class="form-description">
                Sign in to submit reports and track suspicious
                activity you have previously reported.
            </p>


            <form id="user-login-form">

                <!-- EMAIL -->

                <div class="form-group">

                    <label for="user-login-email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="user-login-email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="user-login-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="user-login-password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        minlength="6"
                        required
                    >

                </div>


                <p
                    id="user-login-error"
                    class="error-message"
                ></p>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Sign In
                </button>

            </form>


            <p class="auth-switch">

                Don't have an account?

                <a href="user-register.html">
                    Create one
                </a>

            </p>

        </section>

    </main>


    <footer>

        <div class="footer-inner">

            <div>

                <strong>Ngao</strong>

                <p>
                    Digital Scam & Phishing Reporting Portal
                </p>

            </div>


            <p>
                &copy; 2026 Ngao. Academic Project.
            </p>

        </div>

    </footer>


    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
