<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Analyst Login | Ngao</title>

    <link rel="stylesheet" href="css/style.css">
</head>


<body>

    <header class="site-header">

        <a href="index.html" class="brand">
            Ngao
        </a>

        <nav class="main-nav">

            <a href="index.html">
                Home
            </a>

            <a href="about.html">
                About
            </a>

            <a href="report.html">
                Report Scam
            </a>

            <a href="contact.html">
                Contact
            </a>

            <a href="user-login.html">
                User Portal
            </a>

            <a
                href="analyst-login.html"
                class="active"
            >
                Analyst Portal
            </a>

        </nav>

    </header>


    <main class="auth-page">

        <section class="form-container reveal">

            <p class="eyebrow">
                ANALYST ACCESS
            </p>

            <h1>
                Safety Analyst Portal
            </h1>

            <p class="form-description">
                Sign in to review submitted reports
                and update their assessment status.
            </p>


            <form id="analyst-login-form">


                <div class="form-group">

                    <label for="analyst-login-email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="analyst-login-email"
                        placeholder="analyst@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="analyst-login-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="analyst-login-password"
                        placeholder="Enter your password"
                        minlength="6"
                        required
                    >

                </div>


                <p
                    id="analyst-login-error"
                    class="error-message"
                ></p>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Sign In
                </button>

            </form>

        </section>

    </main>


    <footer>

        <div class="footer-inner">

            <div>

                <strong>
                    Ngao
                </strong>

                <p>
                    Digital Scam & Phishing Reporting Portal
                </p>

            </div>


            <p>
                &copy; 2026 Ngao. Academic Project.
            </p>

        </div>

    </footer>


    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
